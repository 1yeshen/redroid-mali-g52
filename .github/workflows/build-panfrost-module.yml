# ============================================================
# build-panfrost-module.yml
#
# Cross-compile panfrost.ko kernel module for iStoreOS 24.10.6
# (Linux 6.6.127, aarch64, RK3568/EasePi R1).
#
# Strategy:
#   1. Install aarch64 cross-compiler
#   2. Download vanilla Linux 6.6.127 source
#   3. Apply patches (OPP pre-config fix for rockchip_opp_select)
#   4. Fetch OpenWrt kernel config (generic + rockchip/armv8)
#   5. Merge configs + enable CONFIG_DRM + CONFIG_DRM_PANFROST
#   6. Build vmlinux (for Module.symvers)
#   7. Build all DRM modules (drm.ko, gpu-sched.ko, panfrost.ko, etc.)
#   8. Upload as artifact
# ============================================================

name: Build Panfrost Kernel Module

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-panfrost-module.yml'
      - 'patches/0001-panfrost-devfreq-handle-preconfigured-OPP.patch'

env:
  KERNEL_VERSION: 6.6.127
  KERNEL_HASH: a7cd9c97b4f0b31cc030bcdc60abe5434fffb2556e293f7438ce7909dff8c9fe
  ISTOREOS_BRANCH: istoreos-24.10

jobs:
  build-panfrost:
    runs-on: ubuntu-22.04
    # Use a fast runner; module build is CPU-bound (~3-5 min)
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu make bc flex bison \
            libelf-dev libssl-dev dwarves
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download Linux ${KERNEL_VERSION} source
        run: |
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz" \
            -o /tmp/linux-${KERNEL_VERSION}.tar.xz
          echo "${KERNEL_HASH}  /tmp/linux-${KERNEL_VERSION}.tar.xz" | sha256sum -c
          tar xf /tmp/linux-${KERNEL_VERSION}.tar.xz -C /tmp/
          echo "Kernel source extracted to /tmp/linux-${KERNEL_VERSION}"

      - name: Apply Panfrost driver patches
        run: |
          # Apply the OPP pre-configuration fix patch
          PATCH_FILE="${GITHUB_WORKSPACE}/patches/0001-panfrost-devfreq-handle-preconfigured-OPP.patch"
          if [ -f "$PATCH_FILE" ]; then
            cd /tmp/linux-${KERNEL_VERSION}
            echo "=== Applying patch: $PATCH_FILE ==="
            patch -p1 < "$PATCH_FILE"
            echo "=== Patch applied successfully ==="
            echo "=== Modified file: ==="
            grep -n "EBUSY\|EEXIST\|skip_set_regulators" drivers/gpu/drm/panfrost/panfrost_devfreq.c
          else
            echo "WARNING: Patch file not found at $PATCH_FILE, continuing without patch"
          fi

      - name: Fetch iStoreOS kernel config files
        run: |
          git clone --depth=1 --branch ${ISTOREOS_BRANCH} \
            https://github.com/istoreos/istoreos.git /tmp/istoreos

          echo "=== Generic config lines ==="
          wc -l /tmp/istoreos/target/linux/generic/config-6.6
          echo "=== Rockchip armv8 config lines ==="
          wc -l /tmp/istoreos/target/linux/rockchip/armv8/config-6.6

      - name: Generate .config (merge generic + rockchip + Panfrost)
        run: |
          cd /tmp/linux-${KERNEL_VERSION}

          # Step 1: start with generic config
          cp /tmp/istoreos/target/linux/generic/config-6.6 .config

          # Step 2: append rockchip-specific overrides
          # (rockchip config only contains lines that differ from generic)
          cat /tmp/istoreos/target/linux/rockchip/armv8/config-6.6 >> .config

          # Step 3: enable DRM core and Panfrost
          ./scripts/config --enable CONFIG_IOMMU_SUPPORT
          ./scripts/config --enable CONFIG_DMA_SHARED_BUFFER
          ./scripts/config --module CONFIG_DRM
          ./scripts/config --module CONFIG_DRM_PANFROST

          # Step 4: resolve dependencies (auto-select DRM_SCHED, GEM_SHMEM_HELPER, etc.)
          make ARCH=arm64 olddefconfig

          # Verify Panfrost is now =m
          echo "=== Panfrost config status ==="
          grep "^CONFIG_DRM_PANFROST" .config
          echo "=== DRM config status ==="
          grep "^CONFIG_DRM=" .config
          echo "=== IOMMU status ==="
          grep "^CONFIG_IOMMU_SUPPORT" .config

      - name: Prepare kernel build tree
        run: |
          cd /tmp/linux-${KERNEL_VERSION}
          # Generate module.symvers placeholder and prepare headers
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts
          # Generate kernel.release for vermagic matching
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease 2>/dev/null
          echo "=== Kernel release ==="
          cat include/config/kernel.release

      - name: Build vmlinux (for Module.symvers)
        run: |
          cd /tmp/linux-${KERNEL_VERSION}
          # Build vmlinux to generate Module.symvers with all built-in
          # exported symbols. This is needed because M= (external module
          # build) requires Module.symvers to resolve core kernel symbols.
          echo "Building vmlinux (this takes ~3-5 min)..."
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux
          echo "=== vmlinux built ==="
          ls -lh vmlinux 2>/dev/null | awk '{print $5, $9}'
          # Kernel 6.6 generates vmlinux.symvers, not Module.symvers.
          # External module build (M=) needs Module.symvers.
          if [ -f vmlinux.symvers ]; then
            cp vmlinux.symvers Module.symvers
            echo "=== Module.symvers created from vmlinux.symvers ==="
            wc -l Module.symvers
          else
            echo "ERROR: vmlinux.symvers not found!"
            ls -la *.symvers 2>/dev/null || echo "No .symvers files"
            exit 1
          fi

      - name: Build DRM subsystem + panfrost.ko
        run: |
          cd /tmp/linux-${KERNEL_VERSION}
          # Use top-level `modules` target instead of M= because:
          # 1. drm.ko is a composite module (built from drm-y objects)
          #    which M= doesn't handle correctly
          # 2. vmlinux already compiled, modules build is incremental
          # 3. OpenWrt kernel config has few modules, build is fast (~2 min)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules
          echo "=== Build result ==="
          echo "--- DRM modules built ---"
          find drivers/gpu/drm/ -name "*.ko" -type f 2>/dev/null | sort
          echo "--- panfrost.ko ---"
          ls -lh drivers/gpu/drm/panfrost/panfrost.ko 2>/dev/null || echo "BUILD FAILED"

      - name: Verify module vermagic
        run: |
          cd /tmp/linux-${KERNEL_VERSION}
          echo "=== Built modules vermagic ==="
          for mod in $(find drivers/gpu/drm/ -name "*.ko" -type f | sort); do
            VERMAGIC=$(aarch64-linux-gnu-objdump -s -j .modinfo "$mod" 2>/dev/null | grep -oa "vermagic=[^[:space:]]*" | head -1)
            echo "$(basename $mod): $VERMAGIC"
          done

      - name: Package DRM modules as tarball
        run: |
          cd /tmp/linux-${KERNEL_VERSION}
          mkdir -p /tmp/drm-modules
          find drivers/gpu/drm/ -name "*.ko" -type f | sort | while read f; do
            cp --parents "$f" /tmp/drm-modules/
          done
          cp .config /tmp/drm-modules/
          cd /tmp/drm-modules
          tar czf /tmp/drm-modules-${KERNEL_VERSION}.tar.gz .
          echo "=== Tarball contents ==="
          tar tzf /tmp/drm-modules-${KERNEL_VERSION}.tar.gz

      - name: Upload DRM modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: drm-modules-${{ env.KERNEL_VERSION }}
          path: /tmp/drm-modules-${{ env.KERNEL_VERSION }}.tar.gz
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## Panfrost Module Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | ${KERNEL_VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | aarch64 (RK3568/EasePi R1) |" >> $GITHUB_STEP_SUMMARY
          echo "| DRM Module List | See artifact tarball |" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/linux-${KERNEL_VERSION}/drivers/gpu/drm/panfrost/panfrost.ko ]; then
            SIZE=$(stat -c%s /tmp/linux-${KERNEL_VERSION}/drivers/gpu/drm/panfrost/panfrost.ko)
            echo "| panfrost.ko | $((SIZE / 1024)) KB |" >> $GITHUB_STEP_SUMMARY
            TOTAL_MODS=$(find /tmp/linux-${KERNEL_VERSION}/drivers/gpu/drm/ -name "*.ko" -type f | wc -l)
            echo "| Total DRM modules | ${TOTAL_MODS} |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | ✅ Built successfully |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ❌ Build failed |" >> $GITHUB_STEP_SUMMARY
          fi
