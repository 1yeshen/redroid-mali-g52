# ============================================================
# build-panfrost-module.yml
#
# Cross-compile panfrost.ko kernel module for iStoreOS 24.10.6
# (Linux 6.6.127, aarch64, RK3568/EasePi R1).
#
# Strategy:
#   1. Install aarch64 cross-compiler
#   2. Download vanilla Linux 6.6.127 source
#   3. Fetch OpenWrt kernel config (generic + rockchip/armv8)
#   4. Merge configs + enable CONFIG_DRM + CONFIG_DRM_PANFROST
#   5. Cross-compile only panfrost.ko
#   6. Upload as artifact
# ============================================================

name: Build Panfrost Kernel Module

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-panfrost-module.yml'

env:
  KERNEL_VERSION: 6.6.127
  KERNEL_HASH: a7cd9c97b4f0b31cc030bcdc60abe5434fffb2556e293f7438ce7909dff8c9fe
  ISTOREOS_BRANCH: istoreos-24.10

jobs:
  build-panfrost:
    runs-on: ubuntu-22.04
    # Use a fast runner; module build is CPU-bound (~3-5 min)
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu make bc flex bison \
            libelf-dev libssl-dev dwarves
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download Linux ${KERNEL_VERSION} source
        run: |
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz" \
            -o /tmp/linux-${KERNEL_VERSION}.tar.xz
          echo "${KERNEL_HASH}  /tmp/linux-${KERNEL_VERSION}.tar.xz" | sha256sum -c
          tar xf /tmp/linux-${KERNEL_VERSION}.tar.xz -C /tmp/
          echo "Kernel source extracted to /tmp/linux-${KERNEL_VERSION}"

      - name: Fetch iStoreOS kernel config files
        run: |
          git clone --depth=1 --branch ${ISTOREOS_BRANCH} \
            https://github.com/istoreos/istoreos.git /tmp/istoreos

          echo "=== Generic config lines ==="
          wc -l /tmp/istoreos/target/linux/generic/config-6.6
          echo "=== Rockchip armv8 config lines ==="
          wc -l /tmp/istoreos/target/linux/rockchip/armv8/config-6.6

      - name: Generate .config (merge generic + rockchip + Panfrost)
        run: |
          cd /tmp/linux-${KERNEL_VERSION}

          # Step 1: start with generic config
          cp /tmp/istoreos/target/linux/generic/config-6.6 .config

          # Step 2: append rockchip-specific overrides
          # (rockchip config only contains lines that differ from generic)
          cat /tmp/istoreos/target/linux/rockchip/armv8/config-6.6 >> .config

          # Step 3: enable DRM core and Panfrost
          ./scripts/config --enable CONFIG_IOMMU_SUPPORT
          ./scripts/config --enable CONFIG_DMA_SHARED_BUFFER
          ./scripts/config --module CONFIG_DRM
          ./scripts/config --module CONFIG_DRM_PANFROST

          # Step 4: resolve dependencies (auto-select DRM_SCHED, GEM_SHMEM_HELPER, etc.)
          make ARCH=arm64 olddefconfig

          # Verify Panfrost is now =m
          echo "=== Panfrost config status ==="
          grep "^CONFIG_DRM_PANFROST" .config
          echo "=== DRM config status ==="
          grep "^CONFIG_DRM=" .config
          echo "=== IOMMU status ==="
          grep "^CONFIG_IOMMU_SUPPORT" .config

      - name: Prepare kernel build tree
        run: |
          cd /tmp/linux-${KERNEL_VERSION}
          # Generate module.symvers placeholder and prepare headers
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- scripts
          # Generate kernel.release for vermagic matching
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease 2>/dev/null
          echo "=== Kernel release ==="
          cat include/config/kernel.release

      - name: Build panfrost.ko
        run: |
          cd /tmp/linux-${KERNEL_VERSION}
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/gpu/drm/panfrost \
            modules
          echo "=== Build result ==="
          ls -lh drivers/gpu/drm/panfrost/panfrost.ko 2>/dev/null || echo "BUILD FAILED"

      - name: Verify module vermagic
        run: |
          echo "=== Built module vermagic ==="
          /tmp/linux-${KERNEL_VERSION}/scripts/mod/modpost \
            -i /tmp/linux-${KERNEL_VERSION}/Module.symvers \
            -e /tmp/linux-${KERNEL_VERSION}/drivers/gpu/drm/panfrost/panfrost.ko 2>&1 | \
            grep -i vermagic || true
          # Read vermagic via modinfo equivalent
          aarch64-linux-gnu-objdump -s -j .modinfo \
            /tmp/linux-${KERNEL_VERSION}/drivers/gpu/drm/panfrost/panfrost.ko 2>/dev/null | \
            grep -o "vermagic=[^\\x00]*" || true

      - name: Upload panfrost.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: panfrost-ko-${KERNEL_VERSION}
          path: /tmp/linux-${KERNEL_VERSION}/drivers/gpu/drm/panfrost/panfrost.ko
          if-no-files-found: error

      - name: Upload full kernel config for reference
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config-${KERNEL_VERSION}
          path: /tmp/linux-${KERNEL_VERSION}/.config
          if-no-files-found: ignore

      - name: Summary
        run: |
          echo "## Panfrost Module Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | ${KERNEL_VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | aarch64 (RK3568/EasePi R1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Module | panfrost.ko |" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/linux-${KERNEL_VERSION}/drivers/gpu/drm/panfrost/panfrost.ko ]; then
            SIZE=$(stat -c%s /tmp/linux-${KERNEL_VERSION}/drivers/gpu/drm/panfrost/panfrost.ko)
            echo "| Size | $((SIZE / 1024)) KB |" >> $GITHUB_STEP_SUMMARY
            echo "| Status | ✅ Built successfully |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ❌ Build failed |" >> $GITHUB_STEP_SUMMARY
          fi
