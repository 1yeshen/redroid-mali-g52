# ============================================================
# build-mali-overlay.yml
#
# Build a custom redroid Docker image with Mali-G52 GPU HAL
# for RK3568 devices (EasePi R1, Radxa ROCK3A/B, etc.)
#
# Strategy: The Mali userspace GPU drivers (libGLES_mali.so,
# gralloc, hwcomposer) are pre-extracted from RK3568 Android
# firmware and committed to the repository under mali-binaries/.
# This avoids downloading and processing ~500MB firmware on
# every build.
#
# To update Mali binaries from a new firmware:
#   Manually run scripts/extract-mali-from-firmware.sh with a
#   firmware URL, then commit the updated mali-binaries/.
# ============================================================

name: Build Mali-G52 Overlay

on:
  workflow_dispatch:
    inputs:
      redroid_version:
        description: 'Base redroid image tag (e.g. 14.0.0-latest, 14.0.0-arm64)'
        required: false
        default: '14.0.0-latest'
        type: string
      push_to_ghcr:
        description: 'Push image to GitHub Container Registry'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'mali-binaries/**'
      - '.github/workflows/build-mali-overlay.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -----------------------------------------------------------
  # Job 1: Verify Mali binaries exist
  # -----------------------------------------------------------
  verify-mali:
    runs-on: ubuntu-latest
    outputs:
      mali_found: ${{ steps.check-mali.outputs.found }}

    steps:
      - uses: actions/checkout@v4

      - name: Check Mali binaries
        id: check-mali
        run: |
          if [ -f "mali-binaries/vendor/lib64/egl/libGLES_mali.so" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "[✓] Mali GPU driver found in repository!"
            file mali-binaries/vendor/lib64/egl/libGLES_mali.so
            echo ""
            echo "[*] All Mali binaries:"
            find mali-binaries -type f -exec ls -lh {} \;
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "[!] Mali GPU driver NOT found in mali-binaries/"
            echo "    Run scripts/extract-mali-from-firmware.sh first"
          fi

  # -----------------------------------------------------------
  # Job 2: Build Docker overlay image
  # -----------------------------------------------------------
  build-docker:
    runs-on: ubuntu-latest
    needs: verify-mali
    if: needs.verify-mali.outputs.mali_found == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify Mali binaries
        run: |
          echo "[*] Mali binaries to be included:"
          find mali-binaries -type f -exec ls -lh {} \;
          echo ""
          echo "[*] libGLES_mali.so details:"
          file mali-binaries/vendor/lib64/egl/libGLES_mali.so

      - name: Set up QEMU (for aarch64 cross-architecture builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.push_to_ghcr != 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=raw,value=${{ github.event.inputs.redroid_version || '14.0.0-latest' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          build-args: |
            REDROID_BASE=redroid/redroid:${{ github.event.inputs.redroid_version || '14.0.0-latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event.inputs.push_to_ghcr != 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Base image | \`redroid/redroid:${{ github.event.inputs.redroid_version || '14.0.0-latest' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mali driver | ✅ Committed in repo (\`mali-binaries/\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Output image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to use on EasePi R1 (RK3568)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'docker run -d --privileged \' >> $GITHUB_STEP_SUMMARY
          echo '  -v /dev/mali0:/dev/mali0 \' >> $GITHUB_STEP_SUMMARY
          echo '  -v /dev/rga:/dev/rga \' >> $GITHUB_STEP_SUMMARY
          echo '  -v /dev/dri/card0:/dev/dri/card0 \' >> $GITHUB_STEP_SUMMARY
          echo '  -v /dev/mpp_service:/dev/mpp_service \' >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # -----------------------------------------------------------
  # Job 3: Fallback notification
  # -----------------------------------------------------------
  build-fallback:
    runs-on: ubuntu-latest
    if: ${{ needs.verify-mali.outputs.mali_found == 'false' }}
    needs: verify-mali

    steps:
      - uses: actions/checkout@v4

      - name: Notify missing Mali binaries
        run: |
          echo "## ⚠️ Mali Binaries Not Found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The \`mali-binaries/\` directory does not contain Mali GPU drivers." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To fix this:" >> $GITHUB_STEP_SUMMARY
          echo "1. Run \`scripts/extract-mali-from-firmware.sh\` locally with a firmware URL" >> $GITHUB_STEP_SUMMARY
          echo "2. Or place pre-extracted Mali binaries in \`mali-binaries/\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Commit and push the changes" >> $GITHUB_STEP_SUMMARY
